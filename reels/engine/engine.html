<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.scene{position:absolute;inset:0;overflow:hidden;visibility:hidden}
.bg{position:absolute;inset:-60px;background-size:cover;background-position:center;will-change:transform}
.shade{position:absolute;inset:0}
.vid{position:absolute;object-fit:cover}
.vblur{position:absolute;inset:-80px;width:calc(100% + 160px);height:calc(100% + 160px);object-fit:cover;filter:blur(40px) brightness(.45)}
.words{position:absolute;left:70px;right:70px;display:flex;flex-wrap:wrap;row-gap:0;align-content:center}
.w{display:inline-block;margin-right:.22em;font-family:"Inter Display",Inter;font-weight:900;letter-spacing:-.04em;line-height:.98;will-change:transform,opacity,filter}
.kicker{position:absolute;left:70px;right:70px;font:700 34px/1 "Inter Display";letter-spacing:.32em;text-transform:uppercase}
.sub{position:absolute;left:70px;right:70px;font:500 46px/1.3 Inter}
.chatbox{position:absolute;left:60px;right:60px;padding:40px 36px;border-radius:44px;background:rgba(10,12,22,.82);border:1.5px solid rgba(255,255,255,.12);backdrop-filter:blur(20px);display:flex;flex-direction:column;gap:24px;box-shadow:0 40px 120px rgba(0,0,0,.6)}
.chd{display:flex;align-items:center;gap:16px;font:700 26px/1 Inter;letter-spacing:.14em;text-transform:uppercase;color:#9aa3b4}
.chd i{width:16px;height:16px;border-radius:50%;background:#3ddc84;box-shadow:0 0 14px #3ddc84}
.msg{max-width:84%;padding:28px 32px;font:500 40px/1.34 Inter;color:#fff}
.me{align-self:flex-end;border-radius:34px 34px 8px 34px}
.bot{align-self:flex-start;border-radius:34px 34px 34px 8px;background:#151b2b;border:1px solid rgba(255,255,255,.1)}
.typing span{display:inline-block;width:16px;height:16px;border-radius:50%;background:#9aa3b4;margin:0 5px}
.card{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:34px}
.pill{padding:34px 64px;border-radius:999px;font:800 48px/1 "Inter Display";color:#05070c}
.icon{width:260px;height:260px;border-radius:64px;background-size:cover;background-position:center;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.item{position:absolute;left:70px;right:70px;display:flex;align-items:center;gap:30px;padding:30px 36px;border-radius:32px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);font:700 44px/1.2 "Inter Display";color:#fff}
.item b{flex:none;width:86px;height:86px;border-radius:24px;display:grid;place-items:center;font-size:48px}
#bar{position:absolute;left:0;top:0;height:10px;z-index:50}
#tag{position:absolute;left:0;right:0;bottom:70px;display:flex;justify-content:center;align-items:center;gap:16px;font:800 24px/1 "Inter Display";letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.78);z-index:50}
#tag img{height:46px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:60;mix-blend-mode:screen}
#grain{position:absolute;inset:0;z-index:55;opacity:.06;pointer-events:none}
.stars i{position:absolute;border-radius:50%;background:#fff}
</style></head><body>
<div id="stage"></div><div id="bar"></div><div id="tag"></div><canvas id="grain" width="540" height="960"></canvas><div id="flash"></div>
<script>
const E=x=>{x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3)};
const EB=x=>{x=Math.max(0,Math.min(1,x));const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
let SPEC,SC=[],TOTAL=0,TH;
function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function stars(el,seed,n){const r=rnd(seed);let h='';for(let i=0;i<n;i++){const z=r()<.8?2:r()<.95?3:4.5;h+=`<i style="left:${r()*1080}px;top:${r()*1920}px;width:${z}px;height:${z}px;opacity:${(.15+r()*.75).toFixed(2)}"></i>`}el.innerHTML=h}
// "slovo *zvýraznit*" -> spans
function wordsHTML(txt,size,color,accent){return txt.split(' ').map(w=>{const a=/^\*.*\*[.,!?]?$/.test(w);const clean=w.replace(/\*/g,'');return `<span class="w" style="font-size:${size}px;${a?accentStyle(accent):`color:${color}`}">${clean==='/'?'<br>':clean}</span>`}).join(' ').replace(/<span class="w"[^>]*><br><\/span>/g,'<span style="flex-basis:100%;height:0"></span>')}
function accentStyle(a){return a.includes('gradient')?`background:${a};-webkit-background-clip:text;color:transparent`:`color:${a}`}
function build(spec){
  SPEC=spec;TH=spec.theme;const st=document.getElementById('stage');
  document.body.style.background=TH.bg;
  document.getElementById('bar').style.background=TH.accent;
  document.getElementById('tag').innerHTML=spec.tag===false?'':`<img src="emblem.png">${spec.tag||'BrosWars Studio'}`;
  let t0=0;
  spec.scenes.forEach((s,i)=>{
    const d=document.createElement('div');d.className='scene';d.id='s'+i;st.appendChild(d);
    s.t0=t0;t0+=s.dur;s.el=d;
    let bg='';
    if(s.bg) bg=`<div class="bg" style="background-image:url('${s.bg}')"></div><div class="shade" style="background:${s.shade||'linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.25) 40%,rgba(0,0,0,.75))'}"></div>`;
    else bg=`<div class="shade" style="background:${TH.grad||TH.bg}"></div><div class="stars shade"></div>`;
    if(s.type==='clip') bg=`<video class="vblur" src="${s.src}" muted preload="auto"></video><div class="band" style="position:absolute;left:0;width:1080px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.7)"><video class="vid" src="${s.src}" muted preload="auto"></video></div><div class="shade" style="background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 62%,rgba(0,0,0,.75))"></div>`;
    if(s.type==='phone'){const W=s.phoneW||600,Hh=Math.round(W*(s.ratio||2));bg+=`<div class="phone" style="position:absolute;left:${(1080-W)/2-16}px;top:${s.phoneY||520}px;width:${W}px;height:${Hh}px;border:16px solid #0d0d12;border-radius:${Math.round(W*0.13)}px;overflow:hidden;background:#000;box-shadow:0 0 0 3px rgba(255,255,255,.14),0 60px 140px rgba(0,0,0,.75),0 0 160px ${TH.accent}55"><video class="pv" src="${s.src}" muted preload="auto" style="position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% ${s.focusY==null?0:s.focusY*100}%"></video><div style="position:absolute;top:14px;left:50%;width:${Math.round(W*0.28)}px;height:30px;margin-left:-${Math.round(W*0.14)}px;border-radius:20px;background:#0d0d12"></div></div>`}
    let h=bg;
    if(s.kicker) h+=`<div class="kicker" style="top:${s.kickerY||((s.y||420)-80)}px;${s.center?'text-align:center;':''}color:${TH.accent}">${s.kicker}</div>`;
    if(s.text) h+=`<div class="words" style="top:${s.y||420}px;${s.center?'justify-content:center;text-align:center':''}">${wordsHTML(s.text,s.size||150,s.color||TH.fg,TH.accent2||TH.accent)}</div>`;
    if(s.sub) h+=`<div class="sub" style="top:${s.subY||1180}px;color:${TH.mut};${s.center?'text-align:center':''}">${s.sub}</div>`;
    if(s.type==='chat'){h+=`<div class="chatbox" style="top:${s.boxY||640}px"><div class="chd"><i></i>${s.head||'online'}</div>`+s.msgs.map((m,k)=>`<div class="msg ${m.me?'me':'bot'}" data-k="${k}" style="${m.me?`background:${TH.bubble||TH.accent}`:''}">${m.t}</div>`).join('')+`<div class="msg bot typing"><span></span><span></span><span></span></div></div>`}
    if(s.type==='list'){s.items.forEach((it,k)=>{h+=`<div class="item" data-k="${k}" style="top:${(s.listY||700)+k*190}px"><b style="background:${TH.accent}22;color:${TH.accent}">${it.i}</b><span>${it.t}</span></div>`})}
    if(s.type==='cta'){h+=`<div class="card" style="top:${s.cardY||420}px">${s.art?`<img class="art" src="${s.art}" style="width:960px;border-radius:36px;box-shadow:0 40px 120px rgba(0,0,0,.7),0 0 0 2px rgba(255,255,255,.15)">`:''}${s.icon?`<div class="icon" style="background-image:url('${s.icon}')"></div>`:''}<div class="words" style="position:relative;left:auto;right:auto;justify-content:center;max-width:960px">${wordsHTML(s.head,s.size||110,TH.fg,TH.accent2||TH.accent)}</div>${s.pill?`<div class="pill" style="background:${TH.pill||TH.accent};box-shadow:0 0 70px ${TH.accent}88">${s.pill}</div>`:''}${s.foot?`<div class="sub" style="position:relative;left:auto;right:auto;color:${TH.mut};font-size:40px">${s.foot}</div>`:''}</div>`}
    d.innerHTML=h;
    const sd=d.querySelector('.stars');if(sd)stars(sd,i*13+7,220);
  });
  TOTAL=t0;return TOTAL;
}
function seekVideos(sc,lt){const vs=[...sc.el.querySelectorAll('video')];const target=(sc.ss||0)+lt*(sc.rate||1);return Promise.all(vs.map(v=>new Promise(res=>{if(Math.abs(v.currentTime-target)<0.001&&v.readyState>=2)return res();const done=()=>{v.removeEventListener('seeked',done);res()};v.addEventListener('seeked',done);v.currentTime=target;setTimeout(res,4000)})))}
function animWords(el,lt,start,stagger,style){const ws=[...el.querySelectorAll('.w')];ws.forEach((w,i)=>{const p=clamp((lt-start-i*stagger)/0.32,0,1);const e=EB(p);
  if(style==='slam'){w.style.opacity=clamp(p*3,0,1);w.style.transform=`scale(${2.2-1.2*e}) translateY(${(1-e)*-20}px)`;w.style.filter=`blur(${(1-E(p))*16}px)`}
  else if(style==='rise'){w.style.opacity=E(p);w.style.transform=`translateY(${(1-E(p))*110}px) rotate(${(1-E(p))*6}deg)`;w.style.filter='none'}
  else{w.style.opacity=E(p);w.style.transform=`translateX(${(1-E(p))*-60}px)`;w.style.filter=`blur(${(1-E(p))*10}px)`}})}
window.render=async function(t){
  document.getElementById('bar').style.width=(t/TOTAL*1080)+'px';
  let fl=0;
  for(let i=0;i<SPEC.scenes.length;i++){const s=SPEC.scenes[i];const lt=t-s.t0;const on=lt>=0&&lt<s.dur;s.el.style.visibility=on?'visible':'hidden';if(!on)continue;
    // vstup: zoom punch
    const pin=E(lt/0.35),pout=clamp((s.dur-lt)/0.25,0,1);
    s.el.style.transform=`scale(${1.08-0.08*pin})`;s.el.style.opacity=i===0?1:Math.min(1,pin*1.5);
    if(lt<0.12&&i>0)fl=Math.max(fl,(0.12-lt)/0.12*0.3);
    const bg=s.el.querySelector('.bg');if(bg)bg.style.transform=`scale(${1.05+lt/s.dur*0.12}) translate(${(s.panX||0)*lt/s.dur}px,${(s.panY||-20)*lt/s.dur}px)`;
    const st=s.el.querySelector('.stars');if(st)st.style.transform=`translateY(${-lt*14}px) scale(${1+lt*0.01})`;
    if(s.type==='clip'){const v=s.el.querySelector('.vid'),bd=s.el.querySelector('.band');const H=s.bandH||700;bd.style.top=(s.bandY||600)+'px';bd.style.height=H+'px';v.style.cssText=`left:0;top:0;width:1080px;height:${H}px;object-position:${(s.focus||.5)*100}% 50%;transform:scale(${(s.zoom||1.22)+lt*0.025})`; await seekVideos(s,lt)}
    if(s.type==='phone'){const ph=s.el.querySelector('.phone');const p=EB(clamp(lt/0.55,0,1));ph.style.opacity=clamp(p*1.5,0,1);ph.style.transform=`translateY(${(1-p)*220}px) rotate(${(1-p)*-4}deg) scale(${(s.zoom||1)*(0.92+0.08*p)+lt*0.006})`;ph.style.transformOrigin='50% 0';await seekVideos(s,lt)}
    const wd=s.el.querySelector('.words');if(wd)animWords(wd,lt,s.textAt||0.15,s.stagger||0.09,s.anim||'slam');
    const k=s.el.querySelector('.kicker');if(k){const p=E((lt-0.05)/0.4);k.style.opacity=p;k.style.letterSpacing=(0.6-0.28*p)+'em'}
    const sb=s.el.querySelector('.sub');if(sb){const p=E((lt-(s.subAt||0.9))/0.5);sb.style.opacity=p;sb.style.transform=`translateY(${(1-p)*40}px)`}
    if(s.type==='chat'){const box=s.el.querySelector('.chatbox');const pb=E((lt-0.1)/0.45);box.style.opacity=pb;box.style.transform=`translateY(${(1-pb)*80}px)`;
      let tt=0.6;const ty=s.el.querySelector('.typing');ty.style.display='none';
      s.msgs.forEach((m,k)=>{const el=s.el.querySelector(`.msg[data-k="${k}"]`);if(!m.me){const tyEnd=tt+0.9;if(lt>=tt&&lt<tyEnd){ty.style.display='block';box.appendChild(ty);[...ty.children].forEach((d,j)=>d.style.transform=`translateY(${-10*Math.max(0,Math.sin(lt*10-j))}px)`)}tt=tyEnd}
        const p=E((lt-tt)/0.3);el.style.display=lt>=tt?'block':'none';el.style.opacity=p;el.style.transform=`translateY(${(1-p)*30}px) scale(${0.96+0.04*p})`;tt+=m.me?1.0:1.4})}
    if(s.type==='list'){s.el.querySelectorAll('.item').forEach((el,k)=>{const p=EB(clamp((lt-0.5-k*0.45)/0.4,0,1));el.style.opacity=clamp(p,0,1);el.style.transform=`translateX(${(1-p)*-140}px)`})}
    if(s.type==='cta'){const ar=s.el.querySelector('.art');if(ar){const p=E(lt/0.6);ar.style.opacity=p;ar.style.transform=`translateY(${(1-p)*-60}px) scale(${1.04-0.04*p+lt*0.008})`}const ic=s.el.querySelector('.icon');if(ic){const p=EB(clamp(lt/0.5,0,1));ic.style.transform=`scale(${0.4+0.6*p}) rotate(${(1-p)*-12}deg)`;ic.style.opacity=clamp(p*2,0,1)}
      const pl=s.el.querySelector('.pill');if(pl){const p=EB(clamp((lt-0.9)/0.4,0,1));pl.style.opacity=clamp(p,0,1);pl.style.transform=`scale(${(0.6+0.4*p)*(1+0.03*Math.sin(lt*6))})`}
      const ft=s.el.querySelector('.card .sub');if(ft){const p=E((lt-1.3)/0.5);ft.style.opacity=p}}
  }
  document.getElementById('flash').style.opacity=fl;
  // grain
  const g=document.getElementById('grain').getContext('2d');const id=g.createImageData(540,960);const r=rnd(Math.floor(t*30)+1);for(let i=0;i<id.data.length;i+=4){const v=r()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}g.putImageData(id,0,0);
};
</script></body></html>
