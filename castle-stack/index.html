html,body{margin:0;height:100%;overflow:hidden;background:#1b2f4a;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Titan One',sans-serif}
canvas{display:block;width:100%;height:100%}
#mute{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;width:46px;height:46px;border-radius:50%;border:3px solid #2b1a0e;background:linear-gradient(#ffe27a,#ffb52e);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -4px 0 #c27a00,0 4px 0 #2b1a0e;cursor:pointer;z-index:2;padding:9px}
#mute svg{width:100%;height:100%;fill:#2b1a0e;stroke:#2b1a0e}
#gear{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(64px + env(safe-area-inset-right,0px));width:46px;height:46px;border-radius:50%;border:3px solid #2b1a0e;background:linear-gradient(#e2d4ff,#9a7ee0);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -4px 0 #5d40a8,0 4px 0 #2b1a0e;cursor:pointer;z-index:3;padding:8px}
#gear svg{width:100%;height:100%;fill:#2b1a0e}
#setp{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(8,12,30,.62);padding:16px;font-family:'Titan One',sans-serif;color:#3a2412}
#setp[hidden]{display:none!important}
#setp .card{width:min(420px,100%);max-height:92vh;overflow:auto;background:linear-gradient(#fbf0d2,#e8cf98);border:4px solid #2b1a0e;border-radius:22px;padding:18px 18px 14px;box-shadow:inset 0 0 0 4px #c99a52,0 10px 0 rgba(0,0,0,.35),0 24px 60px rgba(0,0,0,.5)}
#setp h2{margin:0 0 12px;text-align:center;font-size:28px;color:#ffc23a;-webkit-text-stroke:2px #2b1a0e;paint-order:stroke fill;font-weight:400;letter-spacing:.03em}
#setp .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0;font-size:16px}
#setp .lab{margin:12px 0 6px;font-size:15px;color:#6b4a2a}
#setp input[type=range]{flex:1;max-width:190px;accent-color:#5cc93f;height:28px}
#setp select{font:inherit;font-size:15px;border:3px solid #2b1a0e;border-radius:10px;padding:4px 8px;background:#fff8e6;color:#2b1a0e}
#setp .seg{display:flex;gap:6px}
#setp button{font-family:inherit;cursor:pointer}
#setp .seg button{flex:1;padding:8px 4px;border:3px solid #2b1a0e;border-radius:12px;background:linear-gradient(#e9d6ae,#c9a77a);color:#2b1a0e;font-size:14px;box-shadow:0 3px 0 #2b1a0e}
#setp .seg button.on{background:linear-gradient(#ffe27a,#ffb52e);transform:translateY(2px);box-shadow:0 1px 0 #2b1a0e}
#setp .tog{width:58px;height:32px;border-radius:16px;border:3px solid #2b1a0e;background:#a08a6a;position:relative;padding:0;flex:none}
#setp .tog i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #2b1a0e;transition:left .15s}
#setp .tog.on{background:#5cc93f}#setp .tog.on i{left:28px}
#setp .danger{background:linear-gradient(#ff9a8a,#e8453c)!important;color:#fff}
#setp .sm{width:100%;margin-top:10px;padding:8px;border:3px solid #2b1a0e;border-radius:12px;font-size:14px;box-shadow:0 3px 0 #2b1a0e}
#setp #resetBox p{margin:10px 0 6px;text-align:center}
#setp .big{display:block;width:100%;margin-top:14px;padding:11px;border:3px solid #2b1a0e;border-radius:16px;background:linear-gradient(#b6f27e,#5cc93f);color:#fff;font-size:20px;-webkit-text-stroke:1.5px #2b1a0e;paint-order:stroke fill;box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -4px 0 #2e8a1c,0 4px 0 #2b1a0e}
#setp button:focus-visible,#gear:focus-visible,#mute:focus-visible{outline:3px solid #fff;outline-offset:2px}

</style>
</head>

 en:[
  ['The Village','Bruno is a young builder from a small village. One night he dreams of the tallest building in the world – and wakes up with a plan.'],
  ['The Stone Keep','The villagers laughed at his wooden tower. "Wood is for barns," said the old mason. So Bruno learned to cut stone.'],
  ['The Elven Fortress','Deep in the old forest, the elves show Bruno how moss and ivy can hold a wall together for a thousand years.'],
  ['The Desert Palace','A sultan heard of the boy who builds to the sky. "Build me a palace taller than the dunes!"'],
  ['The Lighthouse Coast','Ships are lost in the fog. Bruno builds a lighthouse so tall that every sailor can find the way home.'],
  ['The Marble City','Kings and queens now send letters. In the white city of marble, Bruno builds with gold and light.'],
  ['The Jungle Temple','Behind a curtain of vines lies a forgotten temple of jade. Bruno must finish what the ancients started.'],
  ['The Volcano Forge','Inside a sleeping volcano, the dwarves forge stone in lava. Bruno learns to build where the ground is on fire.'],
  ['The Frozen Peaks','To build higher than anyone, Bruno climbs the coldest mountains. The wind howls, but his hands are steady.'],
  ['The Ice Palace','The Snow Queen asks for a palace of ice. Every block must be perfect, or it will crack.'],
  ['The Eastern Pagoda','Across the sea, masters of red lacquer and gold teach Bruno to build roofs that curve like wings.'],
  ['The Great Cathedral','Bruno joins a thousand stonemasons. Together they raise pointed arches and windows of coloured glass.'],
  ['The Coral Palace','Under the waves stands a palace of coral and pearls. Bruno builds with the mermaids by moonlight.'],
  ['The Clockwork City','In the city of inventors, everything ticks. Bruno builds a tower of brass gears that never stops turning.'],
  ['The Fairy Garden','Tiny fairies ask for a tower full of flowers. Bruno builds gently, petal by petal.'],
  ['Above the Clouds','The tower pierces the clouds. Down below, the whole world is watching Bruno build.'],
  ['The Storm Citadel','Lightning cracks around the tower. Only the bravest builder keeps working in the storm.'],
  ['The Night of Stars','Now the stars are close enough to touch. Bruno works by moonlight, one floor at a time.'],
  ['The Aurora Spire','Green and violet lights dance in the sky. The tower glows as if it were alive.'],
  ['The Tower to the Moon','The final climb. One more floor, and another… Bruno is about to build the tallest building in the world!']],
 cs:[
  ['Vesnice','Bruno je mladý stavitel z malé vesnice. Jedné noci se mu zdá o nejvyšší budově na světě – a ráno se probudí s plánem.'],
  ['Kamenná tvrz','Vesničané se jeho dřevěné věži smáli. „Dřevo je na stodoly,“ řekl starý kameník. Tak se Bruno naučil tesat kámen.'],
  ['Elfí pevnost','Hluboko ve starém lese ukážou elfové Brunovi, jak mech a břečťan udrží zeď pohromadě tisíc let.'],
  ['Pouštní palác','Sultán uslyšel o chlapci, který staví až do nebe. „Postav mi palác vyšší než duny!“'],
  ['Pobřeží majáků','Lodě se ztrácejí v mlze. Bruno postaví maják tak vysoký, že každý námořník najde cestu domů.'],
  ['Mramorové město','Teď mu píšou králové a královny. V bílém mramorovém městě staví Bruno ze zlata a světla.'],
  ['Chrám v džungli','Za oponou lián leží zapomenutý chrám z nefritu. Bruno musí dokončit, co dávní stavitelé začali.'],
  ['Sopečná kovárna','Uvnitř spící sopky kují trpaslíci kámen v lávě. Bruno se učí stavět tam, kde hoří země.'],
  ['Zamrzlé hory','Aby postavil výš než kdokoli, vyšplhá Bruno do nejstudenějších hor. Vítr skučí, ale ruce má pevné.'],
  ['Ledový palác','Sněhová královna si přeje palác z ledu. Každý blok musí sedět dokonale, jinak praskne.'],
  ['Východní pagoda','Za mořem učí mistři červeného laku a zlata Bruna stavět střechy zahnuté jako křídla.'],
  ['Velká katedrála','Bruno se přidá k tisícovce kameníků. Společně staví lomené oblouky a okna z barevného skla.'],
  ['Korálový palác','Pod hladinou stojí palác z korálů a perel. Bruno staví s mořskými pannami při měsíci.'],
  ['Hodinové město','Ve městě vynálezců všechno tiká. Bruno staví věž z mosazných ozubených kol, která se nikdy nezastaví.'],
  ['Vílí zahrada','Drobné víly chtějí věž plnou květin. Bruno staví jemně, okvětní lístek po lístku.'],
  ['Nad mraky','Věž protne mraky. Dole pod ní sleduje celý svět, jak Bruno staví.'],
  ['Bouřková citadela','Kolem věže praskají blesky. Jen ten nejodvážnější stavitel pracuje i v bouři.'],
  ['Hvězdná noc','Hvězdy jsou teď na dosah ruky. Bruno pracuje při měsíci, patro po patře.'],
  ['Věž polární záře','Po nebi tančí zelená a fialová světla. Věž září, jako by byla živá.'],
  ['Věž až k Měsíci','Poslední výstup. Ještě jedno patro, a další… Bruno se chystá postavit nejvyšší budovu na světě!']],
 de:[
  ['Das Dorf','Bruno ist ein junger Baumeister aus einem kleinen Dorf. Eines Nachts träumt er vom höchsten Gebäude der Welt – und wacht mit einem Plan auf.'],
  ['Die Steinburg','Die Dorfleute lachten über seinen Holzturm. „Holz ist für Scheunen“, sagte der alte Steinmetz. Also lernte Bruno, Stein zu behauen.'],
  ['Die Elfenfestung','Tief im alten Wald zeigen die Elfen Bruno, wie Moos und Efeu eine Mauer tausend Jahre lang halten.'],
  ['Der Wüstenpalast','Ein Sultan hörte von dem Jungen, der bis zum Himmel baut. „Bau mir einen Palast, höher als die Dünen!“'],
  ['Die Leuchtturmküste','Schiffe verirren sich im Nebel. Bruno baut einen Leuchtturm, so hoch, dass jeder Seemann heimfindet.'],
  ['Die Marmorstadt','Nun schreiben ihm Könige und Königinnen. In der weißen Marmorstadt baut Bruno mit Gold und Licht.'],
  ['Der Dschungeltempel','Hinter einem Vorhang aus Lianen liegt ein vergessener Jadetempel. Bruno muss vollenden, was die Alten begannen.'],
  ['Die Vulkanschmiede','In einem schlafenden Vulkan schmieden Zwerge Stein in Lava. Bruno lernt zu bauen, wo der Boden brennt.'],
  ['Die Eisgipfel','Um höher als alle zu bauen, steigt Bruno in die kältesten Berge. Der Wind heult, doch seine Hände sind ruhig.'],
  ['Der Eispalast','Die Schneekönigin wünscht sich einen Palast aus Eis. Jeder Block muss perfekt sitzen, sonst bricht er.'],
  ['Die östliche Pagode','Jenseits des Meeres lehren Meister aus rotem Lack und Gold Bruno, Dächer wie Flügel zu biegen.'],
  ['Die große Kathedrale','Bruno schließt sich tausend Steinmetzen an. Gemeinsam bauen sie Spitzbögen und bunte Glasfenster.'],
  ['Der Korallenpalast','Unter den Wellen steht ein Palast aus Korallen und Perlen. Bruno baut mit den Meerjungfrauen im Mondlicht.'],
  ['Die Uhrwerkstadt','In der Stadt der Erfinder tickt alles. Bruno baut einen Turm aus Messingzahnrädern, der sich nie anhält.'],
  ['Der Feengarten','Winzige Feen wünschen sich einen Turm voller Blumen. Bruno baut sanft, Blüte für Blüte.'],
  ['Über den Wolken','Der Turm durchbricht die Wolken. Die ganze Welt schaut zu, wie Bruno baut.'],
  ['Die Sturmzitadelle','Blitze zucken um den Turm. Nur der mutigste Baumeister arbeitet im Sturm weiter.'],
  ['Die Sternennacht','Die Sterne sind zum Greifen nah. Bruno arbeitet im Mondlicht, Stockwerk für Stockwerk.'],
  ['Der Polarlichtturm','Grüne und violette Lichter tanzen am Himmel. Der Turm leuchtet, als wäre er lebendig.'],
  ['Der Turm zum Mond','Der letzte Aufstieg. Noch ein Stockwerk, und noch eins… Bruno baut gleich das höchste Gebäude der Welt!']],
 es:[

const SFX_FILES=['place','perfect','cut','collapse','fanfare','star','firework','cheer','scroll','click','dragon','record','whoosh','wind'];
const Snd={ctx:null,master:null,sfxG:null,musG:null,muted:false,ext:false,buf:{},mus:{},curMus:null,windSrc:null,windG:null,loaded:false,

  if(this.ctx.state==='suspended'&&!this.muted&&!this.ext)this.ctx.resume();this.sceneMusic()},

  await Promise.all(SFX_FILES.map(async n=>{try{const r=await fetch('audio/'+n+'.mp3');if(!r.ok)return;const ab=await r.arrayBuffer();this.buf[n]=await new Promise((ok,ko)=>this.ctx.decodeAudioData(ab,ok,ko))}catch(e){}}));
  this.startWind();this.sceneMusic()},
 play(n,o){o=o||{};if(!this.ctx||this.muted||this.ext)return false;const b=this.buf[n];if(!b)return false;const s=this.ctx.createBufferSource();s.buffer=b;s.playbackRate.value=o.rate||1;const g=this.ctx.createGain();g.gain.value=o.vol==null?1:o.vol;s.connect(g);g.connect(this.sfxG);s.start(this.ctx.currentTime+(o.delay||0));return true},
 // --- hudba přes <audio> (streamuje, šetří paměť)
 track(name){if(this.mus[name])return this.mus[name];const el=new Audio('audio/'+name+'.mp3');el.loop=true;el.preload='auto';el.crossOrigin='anonymous';let node=null;try{node=this.ctx.createMediaElementSource(el);const g=this.ctx.createGain();g.gain.value=0;node.connect(g);g.connect(this.musG);this.mus[name]={el,g}}catch(e){this.mus[name]={el,g:null}}return this.mus[name]},

  this.curMus=name;if(!name)return;const m=this.track(name);try{const p=m.el.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}
  if(m.g){m.g.gain.cancelScheduledValues(t);m.g.gain.setValueAtTime(m.g.gain.value,t);m.g.gain.linearRampToValueAtTime(1,t+1.6)}},
 sceneMusic(){if(!this.ctx)return;if(state===ST.PLAY||state===ST.WIN||state===ST.OVER)this.setMusic(lvl%2?'music_game2':'music_game');else this.setMusic('music_menu')},
 startWind(){const b=this.buf.wind;if(!b||this.windSrc)return;const s=this.ctx.createBufferSource();s.buffer=b;s.loop=true;const g=this.ctx.createGain();g.gain.value=0;s.connect(g);g.connect(this.sfxG);s.start();this.windSrc=s;this.windG=g},

 // --- syntéza (záloha)

  prog.q={day:dk,list:pick.map((t,j)=>{const lv=Math.min(2,(r()*3|0));return{t,n:QT[t][lv],got:0,claimed:false,rew:60+lv*45+j*10}})};saveProg()}return prog.q.list}
function qAdd(t,n){const L=questsToday();for(const q of L)if(q.t===t&&!q.claimed){const before=q.got;q.got=Math.min(q.n,q.got+n);if(before<q.n&&q.got>=q.n)setTimeout(()=>toast('✅ '+L2['q'+t].replace('{n}',q.n)),300)}}
function qMax(t,v){const L=questsToday();for(const q of L)if(q.t===t&&!q.claimed){const before=q.got;q.got=Math.min(q.n,Math.max(q.got,v));if(before<q.n&&q.got>=q.n)setTimeout(()=>toast('✅ '+L2['q'+t].replace('{n}',q.n)),300)}}

   if(!doubled){button(VW/2,yy,bw,56*u,'▶ '+L2.double+'  +'+(winBonus+runCoins),'gold',u,true);regBtn(VW/2,yy,bw,56*u,()=>P.rewarded(()=>{prog.coins+=winBonus+runCoins;doubled=true;saveProg();Snd.play('star');for(let k=0;k<12;k++)floats.push({t:-k*.04,txt:'',y:blockY(blocks.length-1)-40,x:WORLD_W/2+(Math.random()-.5)*160,coin:1})}));yy+=64*u}
   button(VW/2,yy,bw,56*u,last?'MENU':L2.next,'green',u,false);regBtn(VW/2,yy,bw,56*u,()=>{if(last){state=ST.MENU;menuT=0;return}withAd(()=>playLevel(lvl+1))})}
 }
 if(state===ST.OVER){
  const a=clamp(overT*1.8,0,1);cx.fillStyle=`rgba(8,12,30,${.5*a})`;cx.fillRect(0,0,VW,VH);
  const pw=Math.min(VW*.86,360*u),ph=280*u,px=VW/2-pw/2,py=VH*.42-ph/2+(1-easeOut(a))*80*u;
  cx.globalAlpha=a;panel(px,py,pw,ph);
  label(L.over,VW/2,py+42*u,26*u,['#ffffff','#ffd8c8'],a);
  if(mode==='endless'){
   medal(VW/2-pw*.25,py+128*u,38*u,medalKind(score));
   label(L.medal[medalKind(score)],VW/2-pw*.25,py+200*u,15*u,['#fff6c8','#ffc23a'],a);
   cx.textAlign='center';cx.fillStyle='#6b4a2a';cx.font=`${16*u}px ${FONT}`;cx.fillText(L.score,VW/2+pw*.2,py+90*u);
   label(String(score),VW/2+pw*.2,py+128*u,50*u,['#ffffff','#ffe8a0'],a);
   cx.fillStyle='#6b4a2a';cx.font=`${15*u}px ${FONT}`;cx.fillText(L.best+'  '+best,VW/2+pw*.2,py+172*u);
   if(newBest){const s=1+Math.sin(time*6)*.06;label(L.newbest,VW/2,py+232*u,26*u*s,['#fff8c8','#ff9a2a'],a)}
  }else{
   bruno(VW/2-pw*.27,py+ph-40*u,.62*u,'idle');
   cx.textAlign='center';cx.fillStyle='#6b4a2a';cx.font=`${16*u}px ${FONT}`;cx.fillText(L2.level+' '+(lvl+1),VW/2+pw*.18,py+92*u);
   label(score+' / '+target,VW/2+pw*.18,py+132*u,44*u,['#ffffff','#ffe8a0'],a);
   cx.fillStyle='#6b4a2a';cx.font=`${15*u}px ${FONT}`;cx.fillText(L2.goal+': '+target+' '+L2.floors,VW/2+pw*.18,py+172*u);
  }
  cx.globalAlpha=1;
  if(runCoins>=5&&!doubled&&overT>.9)smallBtn(VW/2+pw*.16,py+ph-30*u,Math.min(pw*.55,190*u),36*u,'▶ 2× +'+runCoins,u,()=>P.rewarded(()=>{if(doubled)return;doubled=true;prog.coins+=runCoins;saveProg();Snd.play('star');toast('+'+runCoins)}),['#b6f27e','#5cc93f']);
  else label(L2.earned+': +'+runCoins*(doubled?2:1),VW/2+pw*.16,py+ph-30*u,15*u,['#fff6b0','#ffcc33'],a);
  if(overT>.9){const bw=Math.min(VW*.8,300*u);let yy=py+ph+52*u;
   if(!revived&&score>0){button(VW/2,yy,bw,56*u,'▶ '+L2.revive,'gold',u,true);regBtn(VW/2,yy,bw,56*u,()=>P.rewarded(()=>revive()));yy+=64*u}
   button(VW/2,yy,bw,56*u,mode==='campaign'?L2.retry:L.again,'green',u,false);regBtn(VW/2,yy,bw,56*u,()=>withAd(()=>{if(mode==='campaign')playLevel(lvl);else startGame()}));yy+=58*u;
   smallBtn(VW/2,yy,110*u,40*u,'MENU',u,()=>{P.stop();state=ST.MENU;menuT=0;selLvl=-1;if(mode==='campaign'){setLevel(lvl)}mode='campaign';reset();cur=null})}
 }
}
function easeOut(t){return 1-Math.pow(1-t,3)}

// =========================================================
//  SMYČKA
// =========================================================
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(!paused&&!setOpen&&state!==ST.AD){time+=dt;update(dt)}
 cx.setTransform(DPR,0,0,DPR,0,0);
 if(shake>0){cx.translate((Math.random()-.5)*shake*26,(Math.random()-.5)*shake*26)}
 draw();requestAnimationFrame(frame)}
function update(dt){
 if(state===ST.MENU)menuT+=dt;if(state===ST.STORY)storyT+=dt;if(state===ST.WIN){winT+=dt;camT=Math.max(0,(blocks.length-1)*BH-BH*4)}
 if(cur&&state===ST.PLAY){const wv=modOf()==='wave'?1+.5*Math.sin(time*2.4):1;cur.x+=cur.dir*cur.sp*wv*dt;const top=blocks[blocks.length-1];const lim=top.w*.85+46;
  if(cur.x>top.x+lim){cur.x=top.x+lim;cur.dir=-1}if(cur.x<top.x-lim){cur.x=top.x-lim;cur.dir=1}}
 for(const b of blocks)if(b.land>0)b.land=Math.max(0,b.land-dt*7);
 camY+=(camT-camY)*Math.min(1,dt*4.5);
 zoomP=Math.max(0,zoomP-dt*3);zoom=1+Math.sin(zoomP*Math.PI)*.018;
 for(const d of debris){d.vy+=1100*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.r+=d.vr*dt;if(!d.hit&&d.y>BH*2){d.hit=1;rubble(d);Snd.rubble()}}
 debris=debris.filter(d=>d.y<3000);
 for(const p of parts){p.l-=dt;if(p.ring)continue;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.rock||p.g)p.vy+=700*dt;else p.vy+=(p.star?-10:120)*dt;p.vx*=.98}
 parts=parts.filter(p=>p.l>0);
 for(const f of floats)f.t+=dt;floats=floats.filter(f=>f.t<1.1);for(const t of toasts)t.t+=dt;toasts=toasts.filter(t=>t.t<2.7);
 for(const c of cloudsW){c.x+=c.sp*dt;if(c.x>WORLD_W+320)c.x=-320}
 if(shake>0)shake=Math.max(0,shake-dt);if(flash>0)flash=Math.max(0,flash-dt);
 if(state===ST.OVER){overT+=dt;camT=Math.max(0,(blocks.length-1)*BH-BH*5)}
 // ptáci (nízko)
 const h=blocks.length-1;
 if(birds.length<5&&Math.random()<dt*.35){const dir=Math.random()<.5?1:-1;const by=-camY-80-Math.random()*220;for(let k=0;k<3+Math.random()*3;k++)birds.push({x:dir>0?-60-k*18:WORLD_W+60+k*18,y:by+k*10*(k%2?1:-1),vx:dir*(40+Math.random()*10),p:Math.random()*6})}
 for(const b of birds)b.x+=b.vx*dt;birds=birds.filter(b=>b.x>-200&&b.x<WORLD_W+200);
 // drak ve výšce
 if(!dragon&&(mode==='campaign'?curCh>=3:h>=18)&&Math.random()<dt*.04){const dir=Math.random()<.5?1:-1;Snd.dragon();dragon={x:dir>0?-150:WORLD_W+150,y:-camY-250-Math.random()*150,dir,s:.8+Math.random()*.5,vx:dir*70}}
 if(dragon){dragon.x+=dragon.vx*dt;dragon.y+=Math.sin(time*1.3)*12*dt;if(dragon.x<-260||dragon.x>WORLD_W+260)dragon=null}
 // padající hvězdy
 const sk=skyAt(h);if(sk.night>.5&&Math.random()<dt*.25)shooting.push({x:Math.random()*VW,y:Math.random()*VH*.4,vx:-300-Math.random()*200,vy:150+Math.random()*100,l:1});
 for(const s of shooting){s.x+=s.vx*dt;s.y+=s.vy*dt;s.l-=dt*1.2}shooting=shooting.filter(s=>s.l>0);
 // sníh nad 42
 Snd.sceneMusic();Snd.wind(mode==='campaign'?(TIERS[curSkin].snow?.9:TIERS[curSkin].theme==='clouds'?.6:skyH()/50):h/50);
 const want=(TIERS[curSkin].snow?90:mode==='campaign'?0:(h>=40?Math.min(120,(h-38)*6):0));while(snow.length<want)snow.push({x:Math.random(),y:-Math.random()*.2,r:.8+Math.random()*2,vy:.04+Math.random()*.06,ph:Math.random()*6});
 for(const s of snow){s.y+=s.vy*dt;s.x+=Math.sin(time+s.ph)*.02*dt;if(s.y>1.05){if(snow.length>want){s.dead=1}else{s.y=-.05;s.x=Math.random()}}}snow=snow.filter(s=>!s.dead);
 // jiskry ze louče u brány (nízko) / světlušky
 if(embers.length<26&&Math.random()<dt*8)embers.push({x:Math.random(),y:1.02,vy:-(.03+Math.random()*.05),vx:(Math.random()-.5)*.02,r:1+Math.random()*1.6,l:.9,c:Math.random()});
 for(const e of embers){e.y+=e.vy*dt;e.x+=e.vx*dt+Math.sin(time*2+e.c*9)*.0006;e.l-=dt*.25}embers=embers.filter(e=>e.l>0);
}

(async()=>{
 addEventListener('resize',resize);
 try{if(document.fonts&&document.fonts.load)await Promise.race([document.fonts.load('40px "Titan One"'),new Promise(r=>setTimeout(r,1500))])}catch(e){}
 resize();
 await P.init();
 best=+(P.get('cs_best')||0)||0;if(P.get('cs_mute')==='1')Snd.muted=true;setMuteIcon();
 setLang(SET.lang);loadProg();setLevel(Math.min(prog.unl,LEVELS.length-1));setTimeout(()=>{if(state===ST.MENU&&prog.tut&&dailyReady())state=ST.DAILY},1400);
 reset();cur=null;
 // předpečení prvních pater
 for(let i=0;i<14;i++)floorArt(i);
 P.loaded();requestAnimationFrame(frame);
 if(/dev/.test(location.hash))window.__cs={bp:()=>{state=ST.PASS;bpPage=-1},bpxp:n=>{prog.bp.xp=n},promo:o=>{window.__promo=o},target:n=>{target=n},state:n=>{state=n},daily:()=>{state=ST.DAILY},quest:()=>{state=ST.QUEST},prog:()=>prog,gal:mode=>{const c=document.createElement('canvas');c.width=1000;c.height=800;c.style.cssText='position:fixed;left:0;top:0;z-index:99;background:#cfe6ff';document.body.appendChild(c);const g=c.getContext('2d');cx.save();cx.fillStyle='#cfe6ff';cx.fillRect(0,0,VW,VH);for(let i=0;i<20;i++){const x=70+(i%7)*140,y=220+Math.floor(i/7)*260;mode==='suit'?bruno(x,y,1.05,'idle',0,i):bruno(x,y,1.05,'idle',i,0)}cx.restore();g.drawImage(cx.canvas,0,0,1000,800)},page:n=>{shopPage=n},equip:()=>{prog.suit=17;prog.hat=19;prog.flag=18},endless:s=>{mode='endless';state=ST.MENU;setSkin(s);startGame()},coins:n=>{prog.coins=n},shop:t=>{state=ST.SHOP;shopTab=t},snd:()=>({b:Object.keys(Snd.buf).length,m:Snd.curMus,ctx:Snd.ctx&&Snd.ctx.state}),st:()=>({state,score,lvl,curCh,cur:cur&&{x:cur.x},top:blocks[blocks.length-1].x}),perfect:()=>{if(cur){cur.x=blocks[blocks.length-1].x;drop()}},off:(d)=>{if(cur){cur.x=blocks[blocks.length-1].x+d;drop()}},play:n=>playLevel(n),tap:()=>tap(-1,-1),setUnl:n=>{prog.unl=n;for(let k=0;k<n;k++)prog.stars[k]=1+(k%3)}};
})();
})();
